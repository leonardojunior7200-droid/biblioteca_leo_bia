<!-- index.html -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Alimentar</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Sistema de Gestão Alimentar</h1>
    </header>

    <nav>
        <a href="#cardapio">Cardápio</a>
        <a href="#avaliacao">Avaliações</a>
        <a href="#sugestao">Sugestões</a>
        <a href="#presenca">Presença</a>
    </nav>

    <!-- CARDÁPIO -->
    <section id="cardapio" class="card">
        <h2>Cardápio do Dia</h2>

        <div id="lista-cardapio">
            <!-- Dados vindos do PHP -->
        </div>
    </section>

    <!-- AVALIAÇÃO -->
    <section id="avaliacao" class="card">
        <h2>Avaliar Comida</h2>

        <form action="avaliar.php" method="POST">

            <input type="text" name="nome" placeholder="Seu nome" required>

            <select name="nota" required>
                <option value="">Escolha a nota</option>
                <option value="1">1 ⭐</option>
                <option value="2">2 ⭐</option>
                <option value="3">3 ⭐</option>
                <option value="4">4 ⭐</option>
                <option value="5">5 ⭐</option>
            </select>

            <textarea name="comentario" placeholder="Comentário"></textarea>

            <button type="submit">Enviar Avaliação</button>
        </form>
    </section>

    <!-- SUGESTÕES -->
    <section id="sugestao" class="card">
        <h2>Sugestões</h2>

        <form action="sugestao.php" method="POST">

            <input type="text" name="nome" placeholder="Seu nome">

            <textarea name="sugestao" placeholder="Digite sua sugestão"></textarea>

            <button type="submit">Enviar Sugestão</button>
        </form>
    </section>

    <!-- PRESENÇA -->
    <section id="presenca" class="card">
        <h2>Registrar Presença</h2>

        <form id="form-presenca">
            <input type="text" id="input-nome" placeholder="Seu nome" required>
            <button type="submit">Confirmar Presença</button>
        </form>
        
        <p id="msg-presenca" style="display:none; color:#2e7d32; font-weight:bold;">Presença registrada com sucesso!</p>
    </section>

    <script src="script.js"></script>

</body>
</html>
